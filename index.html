<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Corporate Icon Library</title>
  
  <!-- Google Fonts: Inter and Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind config for Casepoint branding -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Newsreader', 'serif'],
          },
          colors: {
            brand: '#2526B3',
            brandHover: '#181499',
            accent: '#FFC83A',
            accentHover: '#E89C00',
            darkBg: '#171713',
            lightBg: '#F5F0E7',
            surfaceLight: '#FFFFFF',
            surfaceDark: '#2C2C28',
          },
          boxShadow: {
            'lux': '0 10px 40px -10px rgba(37, 38, 179, 0.1)',
            'lux-hover': '0 20px 40px -10px rgba(37, 38, 179, 0.2)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-lightBg text-gray-900 dark:bg-darkBg dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300">
  
  <!-- Login Screen -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-lightBg dark:bg-darkBg backdrop-blur-sm transition-opacity duration-300">
    <div class="w-full max-w-md bg-surfaceLight dark:bg-surfaceDark p-10 rounded-2xl shadow-lux border border-gray-100 dark:border-gray-800">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-serif text-brand dark:text-accent mb-2">Team Access</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">Enter the corporate password to view and manage icons.</p>
      </div>
      <form id="loginForm" class="space-y-6">
        <div>
          <input type="password" id="sitePassword" placeholder="Enter Password" required class="block w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-darkBg focus:ring-2 focus:ring-brand focus:border-brand transition-shadow text-gray-900 dark:text-gray-100">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-brand hover:bg-brandHover text-white px-4 py-3 rounded-xl font-medium transition-colors shadow-md hover:shadow-lg">
          Unlock Icon Library
        </button>
        <p id="loginError" class="text-red-500 text-sm text-center hidden font-medium"></p>
      </form>
    </div>
  </div>

  <div id="appContent" class="hidden flex-1">
  <!-- Navigation / Header -->
  <header class="bg-surfaceLight dark:bg-surfaceDark border-b border-gray-200 dark:border-gray-800 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
      
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="bg-brand text-white p-2 rounded-lg shadow-md">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l10-5 10 5-10 5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 7l10 5 10-5"></path></svg>
        </div>
        <h1 class="text-2xl font-serif font-semibold text-gray-900 dark:text-white tracking-tight">Casepoint <span class="font-sans font-normal text-gray-500 text-xl">Icons</span></h1>
      </div>

      <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative w-48 md:w-96">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <input type="text" id="searchInput" class="block w-full pl-11 pr-10 py-2.5 border border-gray-200 dark:border-gray-700 rounded-full leading-5 bg-gray-50 dark:bg-darkBg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all sm:text-sm" placeholder="Search elegant icons...">
          <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hidden transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        
        <button id="openUploadModalBtn" class="flex items-center gap-2 bg-brand hover:bg-brandHover text-white px-5 py-2.5 rounded-full text-sm font-medium transition-all shadow-md hover:shadow-lg">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span class="hidden sm:inline">Upload</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button id="themeToggle" class="p-2 text-gray-400 hover:text-brand dark:hover:text-accent rounded-full focus:outline-none focus:ring-2 focus:ring-brand transition-colors bg-gray-50 dark:bg-darkBg border border-gray-200 dark:border-gray-700">
          <svg id="themeIconDark" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="themeIconLight" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-1 w-full gap-8">
    <!-- Sidebar: Filters & Controls (Same as before) -->

    
    <!-- Main Icon Grid -->
    <main class="flex-1 w-full">
      <div class="mb-6 flex items-center justify-between">
        <p class="text-sm font-medium text-gray-500 uppercase tracking-widest" id="resultsCount">Loading icons...</p>
      </div>
      <div id="iconGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6 xl:gap-8"></div>
      <div id="noResults" class="hidden text-center py-20">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-800 mb-4">
          <svg class="w-8 h-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
        <p class="text-gray-500 dark:text-gray-400 font-medium text-lg">No elegant icons found.</p>
      </div>
    </main>
  </div>

  <!-- Icon Detail Modal -->
  <div id="iconModal" class="fixed inset-0 z-40 hidden transition-opacity duration-300" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-black dark:bg-opacity-60 backdrop-blur-sm backdrop-modal"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
      <div class="relative w-full max-w-2xl rounded-2xl bg-surfaceLight dark:bg-surfaceDark p-8 shadow-lux overflow-hidden flex flex-col max-h-[90vh] border border-gray-100 dark:border-gray-800">
        <button type="button" class="closeModalBtn absolute top-6 right-6 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors z-10">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        
        <div class="sm:flex sm:items-start flex-1 overflow-y-auto min-h-0">
          <div class="mx-auto flex h-32 w-32 flex-shrink-0 items-center justify-center rounded-xl bg-gray-50 dark:bg-darkBg border border-gray-100 dark:border-gray-800 shadow-inner sm:mx-0">
            <div id="modalIconPreview" class="text-brand dark:text-accent"></div>
          </div>
          
          <div class="mt-4 text-center sm:mt-0 sm:ml-8 sm:text-left flex-1 min-w-0">
            <div class="flex items-center justify-between mr-8">
              <h3 class="text-3xl font-serif font-bold text-gray-900 dark:text-white truncate" id="modalIconTitle">icon-name</h3>
            </div>
            
            <div class="mt-3 flex items-center gap-2">
              <div id="modalIconTags" class="flex flex-wrap gap-2"></div>
              <button id="editTagsBtn" class="text-xs text-brand dark:text-accent hover:underline font-medium ml-2 transition-all">Edit Tags</button>
            </div>
            
            <div id="editTagsForm" class="mt-4 hidden bg-gray-50 dark:bg-darkBg p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm">
              <label class="block text-xs font-medium mb-2 text-gray-500 dark:text-gray-400 uppercase tracking-wider">Custom Tags (comma separated)</label>
              <div class="flex gap-2">
                <input type="text" id="editTagsInput" class="block flex-1 px-4 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-surfaceDark focus:ring-2 focus:ring-brand focus:border-brand transition-shadow text-gray-900 dark:text-gray-100">
                <button id="saveTagsBtn" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-md">Save</button>
              </div>
              <div id="editTagsStatus" class="text-xs mt-2 hidden font-medium"></div>
            </div>
            
            <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">

              <div class="relative group">
                <pre class="bg-gray-100 dark:bg-gray-900 p-4 rounded text-sm overflow-x-auto font-mono text-gray-800 dark:text-gray-200 max-w-full"><code id="codeSnippet"></code></pre>
                <button id="copyCodeBtn" class="absolute top-2 right-2 p-2 bg-white dark:bg-gray-800 rounded shadow text-gray-500 hover:text-brand transition-colors text-xs font-medium">Copy</button>
              </div>
            </div>
            
            <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">
              <h4 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-3">Export Options</h4>
              
              <div class="mt-4 flex flex-col sm:flex-row gap-4">
                <div class="w-full sm:w-32">
                  <label class="block text-xs font-medium mb-1 text-gray-500 dark:text-gray-400 uppercase tracking-wider">Export Size (px)</label>
                  <input type="number" id="exportSizeInput" value="512" min="16" max="2048" class="block w-full px-4 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-surfaceDark focus:ring-2 focus:ring-brand focus:border-brand transition-shadow text-gray-900 dark:text-gray-100">
                </div>
                
                <div class="flex gap-3 flex-wrap flex-1 items-end">
                  <button id="downloadSvgBtn" class="flex-1 bg-white dark:bg-surfaceDark border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors shadow-sm">SVG</button>
                  <button id="downloadPngBtn" class="flex-1 bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-md">PNG</button>
                  <button id="downloadJpgBtn" class="flex-1 bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-md">JPG</button>
                </div>
              </div>
            </div>
            
            <div class="mt-6 pt-4 text-right">
               <button id="deleteIconBtn" class="text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300 text-sm font-medium transition-colors">Delete this icon</button>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-black dark:bg-opacity-60 backdrop-blur-sm backdrop-modal"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
      <div class="relative w-full max-w-md rounded-2xl bg-surfaceLight dark:bg-surfaceDark p-8 shadow-lux border border-gray-100 dark:border-gray-800">
        <button type="button" class="closeUploadModalBtn absolute top-6 right-6 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <h3 class="text-2xl font-serif font-bold mb-6 text-gray-900 dark:text-white">Upload New Icon</h3>
        
        <form id="uploadForm" class="space-y-5">
          <div>
            <label class="block text-xs font-medium mb-2 text-gray-500 dark:text-gray-400 uppercase tracking-wider">SVG File</label>
            <input type="file" id="uploadFile" accept=".svg" required class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand file:text-white hover:file:bg-brandHover transition-colors cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-medium mb-2 text-gray-500 dark:text-gray-400 uppercase tracking-wider">Icon Name (e.g. search-bold)</label>
            <input type="text" id="uploadName" required class="block w-full px-4 py-2.5 text-sm border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-darkBg focus:ring-2 focus:ring-brand focus:border-brand transition-shadow text-gray-900 dark:text-gray-100">
          </div>
          <div>
            <label class="block text-xs font-medium mb-2 text-gray-500 dark:text-gray-400 uppercase tracking-wider">Custom Tags (comma separated)</label>
            <input type="text" id="uploadTags" placeholder="e.g. ui, web, interface" class="block w-full px-4 py-2.5 text-sm border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-darkBg focus:ring-2 focus:ring-brand focus:border-brand transition-shadow text-gray-900 dark:text-gray-100">
          </div>

          
          <div class="pt-2">
            <button type="submit" id="submitUploadBtn" class="w-full bg-brand hover:bg-brandHover text-white px-4 py-3 rounded-xl font-medium transition-colors shadow-md flex items-center justify-center gap-2">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              Upload Icon
            </button>
            <p id="uploadStatus" class="mt-3 text-sm text-center hidden font-medium"></p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Prompt Modal -->
  <div id="deleteModal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-black dark:bg-opacity-60 backdrop-blur-sm backdrop-modal"></div>
    <div class="fixed inset-0 z-10 flex items-center justify-center p-4">
      <div class="relative w-full max-w-sm rounded-2xl bg-surfaceLight dark:bg-surfaceDark p-8 shadow-lux border border-gray-100 dark:border-gray-800 text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 dark:bg-red-900/30 mb-4">
          <svg class="h-6 w-6 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        </div>
        <h3 class="text-xl font-serif font-bold mb-2 text-gray-900 dark:text-white">Delete Icon</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Are you sure you want to delete <span id="deleteIconNameDisplay" class="font-bold text-gray-900 dark:text-gray-100"></span>? This action cannot be undone.</p>

        <div class="flex gap-3 justify-center w-full">
          <button type="button" class="closeDeleteModalBtn flex-1 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-200 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 transition-colors">Cancel</button>
          <button type="button" id="confirmDeleteBtn" class="flex-1 bg-red-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-red-700 transition-colors shadow-md">Delete</button>
        </div>
        <p id="deleteStatus" class="mt-4 text-sm font-medium text-center hidden"></p>
      </div>
    </div>
  </div>

  </div>
  <!-- /appContent -->
  <script src="app.js"></script>
</body>
</html>
