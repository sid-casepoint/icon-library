<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="robots" content="noindex, nofollow">
 <title>099 Supply Icon Library</title>
 
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
 
 <script src="https://cdn.tailwindcss.com"></script>
 <script>
 tailwind.config = {
 theme: {
 extend: {
 fontFamily: {
 sans: ['"JetBrains Mono"', 'monospace'],
 mono: ['"JetBrains Mono"', 'monospace'],
 },
 colors: {
 canvas: '#ffffff',
 ink: '#101010',
 charcoal: '#000000',
 mutedHard: '#222222',
 muted: '#555555',
 mutedSoft: '#999999',
 borderSoft: '#c8c8c8',
 borderSubtle: '#e0e0e0',
 },
 borderRadius: {
 'card': '8px',
 'badge': '0px',
 'input': '4px',
 'btn': '9999px',
 }
 }
 }
 }
 </script>
</head>
<body class="bg-canvas text-ink min-h-screen flex flex-col font-sans transition-colors duration-300 antialiased selection:bg-ink selection:text-white uppercase tracking-[0.02em]">
 
 <!-- Login Screen -->
 <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-canvas/80 backdrop-blur-xl transition-opacity duration-500">
 <div class="w-full max-w-sm bg-canvas p-10 rounded-card border border-borderSubtle ">
 <div class="text-center mb-8">
 <div class="mx-auto w-12 h-12 bg-ink rounded--btn flex items-center justify-center mb-6">
 <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
 </div>
 <h2 class="text-2xl font-semibold text-ink tracking-tight mb-2">Icon Library</h2>
 <p class="text-sm text-muted ">Enter your access key to continue</p>
 </div>
 <form id="loginForm" class="space-y-4">
 <div>
 <input type="password" id="sitePassword" placeholder="Access Key" required class="block w-full px-4 py-3 border border-borderSubtle rounded--btn bg-transparent focus:ring-1 focus:ring-ink focus:border-ink transition-all text-ink placeholder-midGray outline-none">
 </div>
 <button type="submit" id="loginBtn" class="w-full bg-ink text-white px-4 py-3 rounded--btn font-medium transition-transform active:scale-95 ">
 Continue
 </button>
 <p id="loginError" class="text-red-500 text-sm text-center hidden font-medium"></p>
 </form>
 </div>
 </div>

 <div id="appContent" class="hidden flex-1">
 <!-- Navigation / Header -->
 <header class="bg-canvas/90 backdrop-blur-xl border-b border-borderSubtle sticky top-0 z-30 transition-colors duration-500">
 <div class="max-w-[1440px] mx-auto px-6 lg:px-12 py-4 flex flex-col gap-4">
 
 <!-- Top Row -->
 <div class="flex items-center justify-between">
 <!-- Logo -->
 <div class="flex items-center gap-3">
 <div class="w-8 h-8 bg-ink rounded--btn flex items-center justify-center">
 <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
 </div>
 <h1 class="text-xl font-semibold tracking-tight text-ink ">Icons</h1>
 </div>

 <!-- Search -->
 <div class="relative w-full max-w-lg mx-8 hidden md:block">
 <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
 <svg class="w-4 h-4 text-muted " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
 </div>
 <input type="text" id="searchInput" class="block w-full pl-11 pr-10 py-2 bg-canvas border border-borderSubtle rounded--btn text-sm focus:outline-none focus:ring-1 focus:ring-ink transition-all text-ink placeholder-midGray " placeholder="Search icons...">
 <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-muted hover:text-ink hidden transition-colors">
 <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
 </button>
 </div>
 
 <div class="flex items-center gap-3">
 <button id="openUploadModalBtn" class="flex items-center gap-2 bg-ink text-white px-4 py-2 rounded--btn text-sm font-medium transition-transform active:scale-95 ">
 <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
 <span class="hidden sm:inline">Upload</span>
 </button>

 <!-- Dark Mode Toggle -->
 <button id="themeToggle" class="p-2 text-muted hover:text-ink rounded--btn transition-colors bg-canvas border border-borderSubtle ">
 <svg id="themeIconDark" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
 <svg id="themeIconLight" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
 </button>
 </div>
 </div>


 </div>
 </header>

 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-1 w-full gap-8">
 <!-- Main Icon Grid -->
 <main class="flex-1 w-full">
 <div class="mb-12 mt-10">
 <h2 class="text-[26px] font-medium text-mutedSoft tracking-[0.18em]" id="resultsCount">MOCKUP ASSETS</h2>
 </div>
 <div id="iconGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6 xl:gap-8"></div>
 <div id="noResults" class="hidden text-center py-20">
 <div class="inline-flex items-center justify-center w-16 h-16 rounded--btn bg-gray-100 mb-4">
 <svg class="w-8 h-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
 </div>
 <p class="text-gray-500 font-medium text-lg">No elegant icons found.</p>
 </div>
 </main>
 </div>

 <!-- Icon Detail Drawer -->
 <div id="iconModal" class="fixed inset-0 z-40 hidden transition-opacity duration-300" role="dialog" aria-modal="true">
 <div class="fixed inset-0 bg-canvas/50 backdrop-blur-sm backdrop-modal"></div>
 <div class="fixed inset-y-0 right-0 z-10 flex justify-end overflow-hidden">
 <div id="iconDrawer" class="relative w-full max-w-[400px] h-screen bg-canvas p-8  overflow-y-auto flex flex-col border-l border-borderSubtle transform translate-x-full transition-transform duration-300">
 <button type="button" class="closeModalBtn absolute top-6 right-6 text-muted hover:text-ink transition-colors z-10">
 <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
 </button>
 
 <div class="flex flex-col items-start flex-1 w-full min-h-0 pt-4">
 <div class="w-full flex justify-center mb-8">
 <div class="flex h-40 w-40 flex-shrink-0 items-center justify-center text-ink ">
 <div id="modalIconPreview" class="w-full h-full"></div>
 </div>
 </div>
 
 <div class="w-full text-left">
 <h3 class="text-2xl font-semibold tracking-tight text-ink mb-3" id="modalIconTitle">icon-name</h3>
 
 <div class="mt-2 flex items-start justify-between gap-4">
 <div id="modalIconTags" class="flex flex-wrap gap-2"></div>
 <button id="editTagsBtn" class="shrink-0 whitespace-nowrap mt-1.5 text-xs font-medium text-muted hover:text-ink transition-colors">Edit Tags</button>
 </div>
 
 <div id="editTagsForm" class="mt-4 hidden bg-canvas p-4 rounded--btn border border-borderSubtle ">
 <label class="block text-xs font-medium mb-2 text-muted ">Tags (comma separated)</label>
 <div class="flex gap-2">
 <input type="text" id="editTagsInput" class="block flex-1 px-3 py-2 text-sm border border-borderSubtle rounded--btn bg-canvas focus:outline-none focus:ring-1 focus:ring-ink text-ink ">
 <button id="saveTagsBtn" class="bg-ink text-white px-4 py-2 rounded--btn text-sm font-medium transition-transform active:scale-95 ">Save</button>
 </div>
 <div id="editTagsStatus" class="text-xs mt-2 hidden font-medium"></div>
 </div>
 
 <div class="mt-8">
 <div class="relative group">
 <pre class="bg-canvas p-4 rounded--btn border border-borderSubtle text-xs overflow-x-auto font-mono text-ink max-w-full"><code id="codeSnippet"></code></pre>
 <button id="copyCodeBtn" class="absolute top-2 right-2 p-2 bg-canvas border border-borderSubtle rounded--btn  text-muted hover:text-ink transition-colors text-xs font-medium">Copy</button>
 </div>
 </div>
 
 <div class="mt-8 border-t border-borderSubtle pt-6">
 <h4 class="text-xs font-medium text-muted mb-4">Export Options</h4>
 
 <div class="flex flex-col sm:flex-row gap-4 items-end">
 <div class="w-full sm:w-24">
 <label class="block text-xs text-muted mb-1">Size (px)</label>
 <input type="number" id="exportSizeInput" value="512" min="16" max="2048" class="block w-full px-3 py-2 text-sm border border-borderSubtle rounded--btn bg-transparent focus:outline-none focus:ring-1 focus:ring-ink text-ink ">
 </div>
 
 <div class="flex gap-2 flex-wrap flex-1 items-end w-full">
 <button id="downloadSvgBtn" class="flex-1 bg-ink text-white px-3 py-2 rounded--btn text-sm font-medium transition-transform active:scale-95 ">SVG</button>
 <button id="downloadPngBtn" class="flex-1 bg-ink text-white px-3 py-2 rounded--btn text-sm font-medium transition-transform active:scale-95 ">PNG</button>
 <button id="downloadJpgBtn" class="flex-1 bg-ink text-white px-3 py-2 rounded--btn text-sm font-medium transition-transform active:scale-95 ">JPG</button>
 </div>
 </div>
 </div>
 
 <div class="mt-8 pt-6 border-t border-borderSubtle text-right">
 <button id="deleteIconBtn" class="text-red-500 hover:text-red-600 text-sm font-medium transition-colors">Delete Icon</button>
 </div>
 
 </div>
 </div>
 </div>
 </div>
 </div>

 <!-- Upload Modal -->
 <div id="uploadModal" class="fixed inset-0 z-50 hidden transition-opacity duration-500" role="dialog" aria-modal="true">
 <div class="fixed inset-0 bg-canvas/80 backdrop-blur-xl backdrop-modal"></div>
 <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
 <div class="relative w-full max-w-sm rounded--card bg-canvas p-8  border border-borderSubtle ">
 <button type="button" class="closeUploadModalBtn absolute top-6 right-6 text-muted hover:text-ink transition-colors">
 <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
 </button>
 <h3 class="text-xl font-semibold tracking-tight mb-6 text-ink ">Upload Icon</h3>
 
 <form id="uploadForm" class="space-y-5">
 <div>
 <label class="block text-xs font-medium mb-1 text-muted ">SVG File</label>
 <input type="file" id="uploadFile" accept=".svg" required class="block w-full text-sm text-muted file:mr-3 file:py-2 file:px-4 file:rounded--btn file:border-0 file:text-xs file:font-medium file:bg-canvas file:text-ink hover:file:bg-borderSubtle:bg-borderDark transition-colors cursor-pointer border border-borderSubtle rounded--btn p-1">
 </div>
 <div>
 <label class="block text-xs font-medium mb-1 text-muted ">Icon Name</label>
 <input type="text" id="uploadName" required class="block w-full px-4 py-3 text-sm border border-borderSubtle rounded--btn bg-transparent focus:outline-none focus:ring-1 focus:ring-ink text-ink ">
 </div>
 <div>
 <label class="block text-xs font-medium mb-1 text-muted ">Tags (comma separated)</label>
 <input type="text" id="uploadTags" placeholder="e.g. ui, web, interface" class="block w-full px-4 py-3 text-sm border border-borderSubtle rounded--btn bg-transparent focus:outline-none focus:ring-1 focus:ring-ink text-ink ">
 </div>
 
 <div class="pt-4">
 <button type="submit" id="submitUploadBtn" class="w-full bg-ink text-white px-4 py-3 rounded--btn font-medium transition-transform active:scale-95  flex items-center justify-center gap-2">
 <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
 Upload
 </button>
 <p id="uploadStatus" class="mt-3 text-sm text-center hidden font-medium"></p>
 </div>
 </form>
 </div>
 </div>
 </div>

 <!-- Delete Prompt Modal -->
 <div id="deleteModal" class="fixed inset-0 z-50 hidden transition-opacity duration-500" role="dialog" aria-modal="true">
 <div class="fixed inset-0 bg-canvas/80 backdrop-blur-xl backdrop-modal"></div>
 <div class="fixed inset-0 z-10 flex items-center justify-center p-4">
 <div class="relative w-full max-w-xs rounded--card bg-canvas p-8  border border-borderSubtle text-center">
 <h3 class="text-xl font-semibold tracking-tight mb-2 text-ink ">Delete Icon</h3>
 <p class="text-sm text-muted mb-6">Are you sure you want to permanently delete this icon?</p>
 <div class="flex flex-col gap-3">
 <button id="confirmDeleteBtn" class="w-full bg-ember hover:bg-red-700 text-white px-4 py-3 rounded--btn font-medium transition-transform active:scale-95 ">Delete Icon</button>
 <button type="button" class="closeDeleteModalBtn w-full bg-transparent border border-borderSubtle text-ink px-4 py-3 rounded--btn font-medium hover:bg-canvas transition-colors">Cancel</button>
 </div>
 <p id="deleteStatus" class="mt-3 text-sm hidden font-medium"></p>
 </div>
 </div>
 </div>

 </div>
 <!-- /appContent -->
 <script src="app.js"></script>
</body>
</html>
