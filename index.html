<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind config for dark mode -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  
  <!-- Navigation / Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <h1 class="text-xl font-bold tracking-tight">Icon Library</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative w-48 md:w-80">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md leading-5 bg-white dark:bg-gray-700 placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-brand focus:border-brand sm:text-sm" placeholder="Search icons...">
        </div>
        
        <button id="openUploadModalBtn" class="flex items-center gap-2 bg-brand hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span class="hidden sm:inline">Upload</span>
        </button>

        <!-- Dark Mode Toggle -->
        <button id="themeToggle" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-brand">
          <svg id="themeIconDark" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="themeIconLight" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-1 w-full gap-8">
    <!-- Sidebar: Filters & Controls (Same as before) -->
    <aside class="w-64 flex-shrink-0 hidden md:block space-y-8">
      <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-4">Preview Controls</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Color</label>
            <div class="flex items-center gap-2">
              <input type="color" id="iconColor" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
              <span class="text-xs text-gray-500" id="iconColorHex">#3b82f6</span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Size: <span id="iconSizeValue">24px</span></label>
            <input type="range" id="iconSize" min="16" max="96" value="24" class="w-full">
          </div>
        </div>
      </div>

    </aside>
    
    <!-- Main Icon Grid -->
    <main class="flex-1">
      <div class="mb-4 flex items-center justify-between">
        <p class="text-sm text-gray-500" id="resultsCount">Loading icons...</p>
      </div>
      <div id="iconGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
      <div id="noResults" class="hidden text-center py-20">
        <p class="text-gray-500">No icons found.</p>
      </div>
    </main>
  </div>

  <!-- Icon Detail Modal -->
  <div id="iconModal" class="fixed inset-0 z-40 hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-gray-900 dark:bg-opacity-80 backdrop-modal"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
      <div class="relative w-full max-w-2xl rounded-lg bg-white dark:bg-gray-800 p-6 shadow-xl">
        <button type="button" class="closeModalBtn absolute top-4 right-4 text-gray-400 hover:text-gray-500">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <div class="sm:flex sm:items-start">
          <div class="mx-auto flex h-32 w-32 items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600">
            <div id="modalIconPreview" class="text-brand"></div>
          </div>
          <div class="mt-3 text-center sm:mt-0 sm:ml-6 sm:text-left flex-1 w-full">
            <h3 class="text-2xl font-bold" id="modalIconTitle">icon-name</h3>
            <div class="mt-2 flex gap-2" id="modalIconTags"></div>
            <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">
              <div class="flex border-b border-gray-200 dark:border-gray-700 mb-4">
                <button class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-brand text-brand" data-tab="svg">SVG</button>
                <button class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500" data-tab="react">React</button>
                <button class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500" data-tab="vue">Vue</button>
              </div>
              <div class="relative group">
                <pre id="codeSnippet" class="bg-gray-100 dark:bg-gray-900 p-4 rounded text-sm overflow-x-auto font-mono text-gray-800 dark:text-gray-200"><code></code></pre>
                <button id="copyCodeBtn" class="absolute top-2 right-2 p-2 bg-white dark:bg-gray-800 rounded shadow text-gray-500 hover:text-brand">Copy</button>
              </div>
            </div>
            <div class="mt-5 flex gap-3 justify-between">
              <button id="downloadSvgBtn" class="bg-brand text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600">Download SVG</button>
              <button id="deleteIconBtn" class="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 px-4 py-2 rounded-md text-sm font-medium transition-colors">Delete Icon</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-gray-900 dark:bg-opacity-80 backdrop-modal"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
      <div class="relative w-full max-w-md rounded-lg bg-white dark:bg-gray-800 p-6 shadow-xl">
        <button type="button" class="closeUploadModalBtn absolute top-4 right-4 text-gray-400 hover:text-gray-500">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <h3 class="text-xl font-bold mb-4">Upload New Icon</h3>
        
        <form id="uploadForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">SVG File</label>
            <input type="file" id="uploadFile" accept=".svg" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-brand file:text-white hover:file:bg-blue-600">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Icon Name (e.g. search-bold)</label>
            <input type="text" id="uploadName" required class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1 text-brand">Team Upload Password</label>
            <input type="password" id="uploadPassword" required class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700">
            <p class="text-xs text-gray-500 mt-1">Required to securely authenticate with GitHub.</p>
          </div>
          
          <div class="pt-4">
            <button type="submit" id="submitUploadBtn" class="w-full bg-brand text-white px-4 py-2 rounded-md font-medium hover:bg-blue-600 flex items-center justify-center gap-2">
              Upload Icon
            </button>
          </div>
          <div id="uploadStatus" class="text-sm font-medium text-center hidden"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Prompt Modal -->
  <div id="deleteModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-gray-900 dark:bg-opacity-80 backdrop-modal"></div>
    <div class="fixed inset-0 z-10 flex items-center justify-center p-4">
      <div class="relative w-full max-w-sm rounded-lg bg-white dark:bg-gray-800 p-6 shadow-xl">
        <h3 class="text-lg font-bold mb-2">Delete Icon?</h3>
        <p class="text-sm text-gray-500 mb-4">Are you sure you want to delete <span id="deleteIconNameDisplay" class="font-bold"></span>?</p>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1 text-brand">Team Upload Password</label>
          <input type="password" id="deletePassword" required class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700">
        </div>
        <div class="flex gap-3 justify-end">
          <button type="button" class="closeDeleteModalBtn px-4 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700">Cancel</button>
          <button type="button" id="confirmDeleteBtn" class="bg-red-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-red-600">Delete</button>
        </div>
        <div id="deleteStatus" class="text-sm font-medium text-center mt-3 hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
